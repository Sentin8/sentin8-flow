[package]
name = "sentin8-flow-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust HTTP client for Sentin8:Flow (workflow engine)."

[lib]
name = "sentin8_flow_client"
path = "src/lib.rs"

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
sentin8-middleware.workspace = true
sentin8-m2m.workspace = true
sentin8-flow-contracts = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
sentin8-tls = { workspace = true }